[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "numlint"
version = "0.1.0"
description = "Multilingual number & currency verification for translated text. 28 languages, cross-lingual magnitude validation, live financial data checks."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.10"
authors = [{ name = "Felix Lin", email = "felix@lcn.tw" }]
keywords = ["nlp", "multilingual", "number", "currency", "translation", "verification", "lint", "qa"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["httpx>=0.24"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1"]

[project.urls]
Homepage = "https://github.com/FakeRocket543/numlint"
Issues = "https://github.com/FakeRocket543/numlint/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/numlint"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120
